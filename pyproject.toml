[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pppoe-cred-helper"
version = "1.0.0"
description = "A hardened utility to capture PPPoE credentials for ISP router replacement."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "FRIKIdelTO", email = "pablo@frikidelto.com"}
]
dependencies = [
    "netifaces",
    "rich",
]

[project.scripts]
pppoe-cred-helper = "pppoe_cred_helper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pppoe_cred_helper*"]
